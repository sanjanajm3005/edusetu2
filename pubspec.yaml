name: ai_edu_app
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  # UI / animations
  lottie: ^3.3.1
  google_fonts: ^6.2.1
  youtube_player_flutter: ^9.0.2

  # State / storage
  provider: ^6.1.0
  shared_preferences: ^2.2.3

  # Networking
  http: ^1.5.0

  # For opening YouTube links
  url_launcher: ^6.1.10

  # AI / Gemini
  google_generative_ai: ^0.4.3
  flutter_gemini: ^3.0.0

  # Firebase
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.1
  cloud_firestore: ^6.0.3

  # Voice
  speech_to_text: ^7.3.0
  flutter_tts: ^4.2.3

  # PDF utilities
  pdf: ^3.10.6
  path_provider: ^2.1.2
  open_filex: ^4.5.0
  universal_html: ^2.2.4
  # downloads_path_provider_28: ^0.1.2
  permission_handler: ^12.0.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
